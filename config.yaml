
data:
  subjects:
    - EC243
    - EC248
    - EC250
    - EC253
    - EC260
    - EC270
    - EC278
    - EC279
    - EC282
    - EC287


analysis:
  epoch_sfreq: 100
  epoch_tmin: -0.4

  phon_response_peak_threshold: 0.65
  behav_response_peak_threshold: 0.01
  ambiguous_response_threshold: 2

  fdr_alpha: 0.05

  behav_ttest_pvalue_threshold: 0.001

  behav_peak_post_offset_s: 0.2

  hga_window_source: "decoder"

  decoding:
    # Global configuration for all sliding window decoders
    min_sample: 1
    window_size: 15
    stride: 2
    n_jobs: 4

  multivariate:
    window_sizes: [10]          # 100ms at 100Hz; robustness: [5, 10, 15]
    stride: 2                   # match existing univariate pipeline
    pca_num_components: "auto"  # GridSearchCV over [0.25, 0.5, 0.9]
    n_jobs: 4

  multivariate_ambiguity:
    stratum_min_trials: 5           # drop strata smaller than this before CV
    behavior_imbalance_threshold: 0.2  # flag cell for follow-up if stratum-count CV exceeds this

  sweep:
    phon_response_peak_thresholds: [0.55, 0.60, 0.65]
    behav_response_peak_thresholds: [0.005, 0.010, 0.020]
    ambiguous_response_thresholds: [1, 2, 3]


causal6:
  # Per-task L2 penalty strengths for the GPU-batched decoders.
  # My convention: reg_lambda scales the PENALTY term. sklearn's C scales the
  # LOSS term, giving the inverse correspondence: C_sklearn == 1 / reg_lambda.
  # Null values fall back to 1.0 until reg_lambda_sweep has been run; after the
  # sweep, update these in place with the winners.
  reg_lambda_acoustic: null
  reg_lambda_behavior_full: null
  reg_lambda_behavior_hga_only: null

  # Solver
  max_iter: 50
  tol: 1.0e-6

  # Outer CV
  n_folds: 5
  cv_random_state: 42

  # Target device for torch (cuda | mps | cpu)
  device: cuda

  # Tuning-sweep grid (only used by reg_lambda_sweep)
  tuning_reg_lambda_grid: [0.01, 0.1, 1.0, 10.0]