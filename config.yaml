
data:
  subjects:
    - EC243
    - EC248
    - EC250
    - EC253
    - EC260
    - EC270
    - EC278
    - EC279
    - EC282
    - EC287


analysis:
  epoch_sfreq: 100
  epoch_tmin: -0.4

  # Speech-responsive screen (causal6). See notebooks/causal6/find_speech_responsive.py
  # for the full criterion and motivation. Tuning for these values is documented
  # in scripts/refined_speech_responsive.py.
  speech_responsive:
    post_tmax_s: 0.6
    t_threshold: 7.0

  phon_response_peak_threshold: 0.65
  behav_response_peak_threshold: 0.01
  ambiguous_response_threshold: 2

  fdr_alpha: 0.05

  behav_ttest_pvalue_threshold: 0.001

  behav_peak_post_offset_s: 0.2

  hga_window_source: "decoder"

  decoding:
    # Global configuration for all sliding window decoders
    min_sample: 1
    window_size: 15
    stride: 2
    n_jobs: 4
    # Post-hoc peak-finding bounds: summarize/peaks rules restrict peak
    # selection to windows with smin >= peak_search_smin and smax <= peak_search_smax.
    # These defaults are used by the behavior decoders (peak-search spans
    # most of the epoch, further constrained per-word_end by the offset
    # cap in the summarize notebooks).
    peak_search_smin: 0
    peak_search_smax: 290
    # Acoustic-specific override: the STG acoustic response is known to be
    # transient and peaks ~150-250ms post word onset (CLAUDE.md / project
    # prior). Restricting peak-search to 100-350ms is a pre-registered
    # range that drops W_effective from ~21 to ~3-4, which is what makes
    # BH-FDR across all tested sites achievable at K=500 permutations.
    # Claims about later re-expression of the acoustic code are tested
    # elsewhere (cross-window transfer / late-window direct tests) — NOT
    # via this peak search.
    # In samples with epoch_tmin=-0.4, sfreq=100:
    #   smin >= 50 → window starts >= 100ms post onset
    #   smax <= 75 → window ends <= 350ms post onset
    acoustic_peak_search_smin: 50
    acoustic_peak_search_smax: 75

  multivariate:
    window_sizes: [10]          # 100ms at 100Hz; robustness: [5, 10, 15]
    stride: 2                   # match existing univariate pipeline
    pca_num_components: "auto"  # GridSearchCV over [0.25, 0.5, 0.9]
    n_jobs: 4

  multivariate_ambiguity:
    stratum_min_trials: 5           # drop strata smaller than this before CV
    behavior_imbalance_threshold: 0.2  # flag cell for follow-up if stratum-count CV exceeds this

  sweep:
    phon_response_peak_thresholds: [0.55, 0.60, 0.65]
    behav_response_peak_thresholds: [0.005, 0.010, 0.020]
    ambiguous_response_thresholds: [1, 2, 3]


causal6:
  # Per-task L2 penalty strengths are NOT stored here — they live in
  # outputs/causal6/reg_lambda_sweep/reg_lambda_winners.json, written by the
  # reg_lambda_sweep rule and read back by each decoder rule as a Snakemake
  # input. This keeps the tuned values version-controlled with the sweep
  # artifacts rather than requiring a manual copy-paste step.
  # My convention: reg_lambda scales the PENALTY term. sklearn's C scales the
  # LOSS term, giving the inverse correspondence: C_sklearn == 1 / reg_lambda.

  # Solver
  max_iter: 50
  tol: 1.0e-6

  # Outer CV
  n_folds: 5
  cv_random_state: 42
  # Extra CV seeds to re-sweep at for λ-winner stability check (reg_lambda_sweep
  # only). Empty = no stability check. Canonical winners always come from
  # `cv_random_state` above; extras go into sweep_seed_comparison.parquet.
  # Rerunning at N extras ~= Nx more GPU time; 1-2 is usually sufficient.
  compare_cv_seeds: [0, 1]

  # Target device for torch (cuda | mps | cpu)
  device: cuda

  # Tuning-sweep grid (only used by reg_lambda_sweep)
  tuning_reg_lambda_grid: [0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]

  # Permutation significance testing (refit-based null per decoder), with
  # two-stage adaptive K. Each *_null rule first runs K_stage1 perms across
  # all speech-responsive electrodes; sites with global-min K1
  # max-stat-corrected p over their decoder's flavors <=
  # escalate_corrected_p_max are flagged for K_stage2 additional perms
  # (non-overlapping seeds for determinism). Non-escalated sites stop at
  # K_stage1; escalated sites end with K_stage1+K_stage2 (the floor for
  # max-stat-corrected p-values).
  n_permutations_stage1: 1000
  n_permutations_stage2: 9000
  escalate_corrected_p_max: 0.20
  permutation_seed: 0          # base RNG seed; stage 1 uses [seed, seed+K1),
                               # stage 2 uses [seed+K1, seed+K1+K2).
  permutation_chunk_size: 10   # permutations fit per GPU call
