[project]
name = "barakeet"
version = "0.0.0"
description = "Neural mechanisms of perceptual disambiguation in speech cortex"
requires-python = ">=3.11,<3.13"
dependencies = [
    # core scientific stack
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "polars~=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15",          # parquet backend
    "h5py>=3.10",
    # neuro / signal
    "mne~=1.9",
    # models / stats
    "torch~=2.4",
    "statsmodels>=0.14",
    # viz
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pypdf>=4",  # PDF concatenation for causal46_joined/t_tests filtered gallery
    # utils
    "loguru>=0.7",
    "tqdm>=4.66",
    "joblib>=1.3",
    "textgrid>=1.5",
    # pipeline
    "snakemake>=9",
    "jupytext>=1.16",
    "ploomber>=0.23",
    "ploomber-engine>=0.0.31",
    "ipykernel>=6.29",  # kernel used by ploomber_engine for notebook execution
    "iprogress>=0.4",
    "ipywidgets>=8.1.8",
    "pip>=26.1.2",
]

[project.optional-dependencies]
# Needed by workflows/causal6.Snakefile select_gpu_device (real GPU scheduling).
gpu = ["gputil>=1.4"]
# Developer tooling.
dev = ["pytest>=8", "snakeviz>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.marimo.runtime]
pythonpath = ["."]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: requires preprocessed EC248 epochs on disk; slow; skipped by default",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pynvml>=13.0.1",
    "snakemake-executor-plugin-cluster-generic>=1.0.9",
]
