[project]
name = "barakeet"
version = "0.0.0"
description = "Neural mechanisms of perceptual disambiguation in speech cortex"
requires-python = ">=3.11,<3.13"
dependencies = [
    # core scientific stack
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "polars~=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15",          # parquet backend
    "h5py>=3.10",
    # neuro / signal
    "mne~=1.9",
    # models / stats
    "torch~=2.4",
    "statsmodels>=0.14",
    # viz
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # utils
    "loguru>=0.7",
    "tqdm>=4.66",
    "joblib>=1.3",
    "textgrid>=1.5",
    # pipeline
    "snakemake>=9",
    "jupytext>=1.16",
    "ploomber>=0.23",
    "ploomber-engine>=0.0.31",
    "ipykernel>=6.29",  # kernel used by ploomber_engine for notebook execution
]

[project.optional-dependencies]
# Needed by workflows/causal6.Snakefile select_gpu_device (real GPU scheduling).
gpu = ["gputil>=1.4"]
# Developer tooling.
dev = ["pytest>=8", "snakeviz>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.marimo.runtime]
pythonpath = ["."]
